# Runs the Matrix node's tests on every pull request and push to main (free for
# public repositories). Plain Python: the tests bring stand-ins for CircuitPython.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall -q CIRCUITPY sim tests scripts
      - name: Tests
        run: python tests/test_matrix_node.py
